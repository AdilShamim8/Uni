<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Uni</title>
  <desc id="desc">A white U on a black app tile, drawn as one rounded stroke that echoes the Uni violet accent inside its counter.</desc>

  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230.4" /></clipPath>

    <!-- The Uni violet, the app's accent: bright edge to deep base. -->
    <linearGradient id="uni-violet" x1="24%" y1="8%" x="80%" y2="96%">
      <stop offset="0"    stop-color="#bcb0ff" />
      <stop offset="0.42" stop-color="#8778f2" />
      <stop offset="1"    stop-color="#5b4bc4" />
    </linearGradient>
  </defs>

  <!-- macOS icon grid: the tile is 824x824 inside a 1024 canvas (corner radius
       185.4), not the full canvas — a full-bleed tile renders noticeably larger
       than every other icon in the Dock. The tile is drawn at 1024 and scaled
       into the grid, so the artwork inside keeps its own coordinates. -->
  <g transform="translate(100 100) scale(0.8046875)">
    <g clip-path="url(#tile)">
      <rect width="1024" height="1024" fill="#000000" />

      <!-- The U: one continuous rounded stroke, thick and confident, with a
           soft violet glow so the glyph lifts off the black. -->
      <g filter="url(#none)">
        <path fill="none" stroke="url(#uni-violet)" stroke-width="150"
              stroke-linecap="round" stroke-linejoin="round"
              d="M 340 260 L 340 560
                 A 172 172 0 0 0 684 560
                 L 684 260" />
        <!-- the inner counter picks the bright edge of the gradient back up -->
        <path fill="none" stroke="#bcb0ff" stroke-opacity="0.32" stroke-width="26"
              stroke-linecap="round"
              d="M 372 300 L 372 552
                 A 140 140 0 0 0 652 552
                 L 652 300" />
      </g>
    </g>
  </g>
</svg>
