name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (shared schemas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22 LTS: jsdom 30 → undici 8 requires Node >= 22.19
          # (zlib zstd decompress API). Node 20 crashes at import time:
          # "Cannot read properties of undefined (reading 'bind')" in
          # undici/lib/interceptor/decompress.js. Verified locally on
          # Node 22.20.0: 339 frontend + 117 backend tests pass.
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  backend:
    name: Backend (typecheck + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            packages/contracts/package-lock.json
      # The backend depends on the shared contracts package; install and
      # build it first (npm ci in backend links the file: dependency).
      - name: Install and build contracts
        working-directory: packages/contracts
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run typecheck
      # Integration tests boot an embedded PostgreSQL per file — no service
      # container needed; linux runners download the binaries on install.
      - run: npm test
