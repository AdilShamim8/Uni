# Development infrastructure for the Uni backend.
# Safe defaults: the database binds to loopback only, uses throwaway dev
# credentials, and keeps data in a named volume. For hosted use, provide
# a managed/private PostgreSQL and inject real secrets via environment —
# never via this file.

services:
  postgres:
    image: postgres:17-alpine
    container_name: uni-postgres-dev
    environment:
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: uni_dev_change_me
      POSTGRES_DB: uni
    ports:
      # Loopback-only binding: do not expose development Postgres beyond this host.
      - "127.0.0.1:5432:5432"
    volumes:
      - uni-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni -d uni"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  uni-postgres-dev:
